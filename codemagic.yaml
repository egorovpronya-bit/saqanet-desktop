workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: "false"
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    scripts:
      - name: Flutter packages and codegen
        script: |
          flutter pub get
          dart run slang
          dart run build_runner build --delete-conflicting-outputs --low-resources-mode
      - name: Unpack iOS core
        script: |
          cd ios/Frameworks
          unzip -o Libcore.xcframework.zip
          rm -rf HiddifyCore.xcframework
          mv Libcore.xcframework HiddifyCore.xcframework
      - name: CocoaPods
        script: |
          cd ios
          pod update Sentry/HybridSDK --repo-update
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files \
            "ru.saqanet.vpn" \
            "ru.saqanet.vpn.HiddifyPacketTunnel" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - egorovpronya@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
