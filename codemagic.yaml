workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - code-signing
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: "false"
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    scripts:
      - name: Flutter packages and codegen
        script: |
          flutter pub get
          dart run slang
          dart run build_runner build --delete-conflicting-outputs --low-resources-mode
      - name: Build iOS core from source
        script: |
          set -euo pipefail
          # ray2sing is a nested submodule pinned via an SSH URL (git@github.com:...);
          # it's public, so rewrite SSH to HTTPS to avoid needing a deploy key in CI.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          cd hiddify-core
          git submodule update --init --recursive
          brew install go
          export PATH="$(go env GOPATH)/bin:$PATH"
          # `make ios` builds bin/HiddifyCore.xcframework, but gomobile bind bakes
          # the Swift module name from the -o basename (see cmd/gomobile/bind_iosapp.go:
          # title = strings.Title(basename without .xcframework)), so that comes out
          # named "HiddifyCore" - not "Libcore", the module every Swift file in ios/
          # imports (see ios/Local Packages/Package.swift's Libcore binaryTarget,
          # and the direct HiddifyCore.xcframework link in Runner.xcodeproj - both
          # point at this same file and both need the per-slice framework inside it
          # to be named Libcore.framework, confirmed against the previously-committed
          # prebuilt ios/Frameworks/Libcore.xcframework.zip). `-libname` is unrelated
          # to this (it only affects the Android .aar name).
          # `make ios`'s own recipe (below, kept in sync with hiddify-core's Makefile)
          # is reproduced here with only the -o basename changed. Deliberately NOT
          # doing `make ios`'s own `cp Info.plist bin/HiddifyCore.xcframework/` step:
          # hiddify-core/Info.plist is a static, hand-written file hardcoding
          # LibraryPath/BinaryPath as "HiddifyCore.framework" - copying it in would
          # clobber the correct Info.plist that `xcodebuild -create-xcframework`
          # (invoked internally by gomobile bind) already generated for Libcore.framework.
          make lib_install
          gomobile bind -v -target ios -libname=hiddify-core \
            -tags=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc,with_awg,tfogo_checklinkname0,with_naive_outbound,with_conntrack,with_dhcp,with_low_memory,with_purego \
            -trimpath -ldflags="-w -s -checklinkname=0 -buildid= ${CODE_VERSION:-}" \
            -o bin/Libcore.xcframework \
            github.com/sagernet/sing-box/experimental/libbox ./platform/mobile
          cd ..
          rm -rf ios/Frameworks/HiddifyCore.xcframework
          cp -r hiddify-core/bin/Libcore.xcframework ios/Frameworks/HiddifyCore.xcframework
      - name: CocoaPods
        script: |
          cd ios
          rm -f Podfile.lock
          pod install --repo-update
      - name: Set up code signing
        script: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Codemagic group code-signing is missing secret CERTIFICATE_PRIVATE_KEY."
            exit 1
          fi
          keychain initialize
          python3 ios/ci_capabilities.py --write-api-key /tmp/asc_api_key.p8
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/asc_api_key.p8)"
          rm -f /tmp/asc_api_key.p8
          python3 ios/ci_capabilities.py
          app-store-connect fetch-signing-files "ru.saqanet.vpn" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          app-store-connect fetch-signing-files "ru.saqanet.vpn.HiddifyPacketTunnel" \
            --type IOS_APP_STORE \
            --create \
            --strict-match-identifier \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          flutter build ios --release --config-only
          python3 ios/ci_signing.py
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Symbolicate known crash addresses (diagnostic, remove once root-caused)
        script: |
          ARCHIVE=$(find build/ios/archive -maxdepth 1 -name "*.xcarchive" | head -1)
          echo "Archive: $ARCHIVE"
          find "$ARCHIVE/dSYMs" -maxdepth 1 2>/dev/null

          RUNNER_DSYM=$(find "$ARCHIVE/dSYMs" -iname "Runner.app.dSYM" | head -1)
          RUNNER_BASE=4298964992
          printf -v BASEH '0x%x' $RUNNER_BASE
          printf -v A1 '0x%x' $((RUNNER_BASE+723556))
          printf -v A2 '0x%x' $((RUNNER_BASE+719052))
          echo "=== Runner (crashing thread, SIGABRT trigger) ==="
          xcrun atos -arch arm64 -o "$RUNNER_DSYM/Contents/Resources/DWARF/Runner" -l $BASEH $A1 $A2 || echo "atos failed for Runner"

          FLUTTER_DSYM=$(find "$ARCHIVE/dSYMs" -iname "Flutter.framework.dSYM" | head -1)
          FLUTTER_BASE=4397432832
          printf -v FBASEH '0x%x' $FLUTTER_BASE
          printf -v F1 '0x%x' $((FLUTTER_BASE+5169068))
          printf -v F2 '0x%x' $((FLUTTER_BASE+90560))
          printf -v F3 '0x%x' $((FLUTTER_BASE+368424))
          printf -v F4 '0x%x' $((FLUTTER_BASE+368084))
          echo "=== Flutter.framework (main thread, concurrent activity) ==="
          xcrun atos -arch arm64 -o "$FLUTTER_DSYM/Contents/Resources/DWARF/Flutter" -l $FBASEH $F1 $F2 $F3 $F4 || echo "atos failed for Flutter"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - egorovpronya@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-sim-debug:
    name: iOS Simulator crash capture (diagnostic)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: "false"
    scripts:
      - name: Flutter packages and codegen
        script: |
          flutter pub get
          dart run slang
          dart run build_runner build --delete-conflicting-outputs --low-resources-mode
      - name: Build iOS core from source (device + simulator slices)
        script: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          cd hiddify-core
          git submodule update --init --recursive
          brew install go
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lib_install
          gomobile bind -v -target ios,iossimulator -libname=hiddify-core \
            -tags=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc,with_awg,tfogo_checklinkname0,with_naive_outbound,with_conntrack,with_dhcp,with_low_memory,with_purego \
            -trimpath -ldflags="-w -s -checklinkname=0 -buildid= ${CODE_VERSION:-}" \
            -o bin/Libcore.xcframework \
            github.com/sagernet/sing-box/experimental/libbox ./platform/mobile
          cd ..
          rm -rf ios/Frameworks/HiddifyCore.xcframework
          cp -r hiddify-core/bin/Libcore.xcframework ios/Frameworks/HiddifyCore.xcframework
      - name: CocoaPods
        script: |
          cd ios
          rm -f Podfile.lock
          pod install --repo-update
      - name: Build for Simulator and launch with console capture
        script: |
          set -euo pipefail
          flutter build ios --simulator --debug --no-codesign

          RUNTIME=$(xcrun simctl list runtimes | grep -i iOS | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS[0-9A-Za-z-]+')
          DEVICETYPE=$(xcrun simctl list devicetypes | grep "iPhone 15 " | head -1 | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+')
          echo "Runtime: $RUNTIME, DeviceType: $DEVICETYPE"
          SIMID=$(xcrun simctl create SaqanetDebug "$DEVICETYPE" "$RUNTIME")
          echo "Simulator: $SIMID"
          xcrun simctl boot "$SIMID"
          xcrun simctl bootstatus "$SIMID" -b

          APP_PATH=$(find build/ios/iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP_PATH/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"

          xcrun simctl install "$SIMID" "$APP_PATH"

          echo "=== Launching with console capture (up to 45s) ==="
          (xcrun simctl launch --console-pty "$SIMID" "$BUNDLE_ID" 2>&1 &
           LAUNCH_PID=$!
           sleep 45
           kill "$LAUNCH_PID" 2>/dev/null || true
           wait "$LAUNCH_PID" 2>/dev/null || true)

          echo "=== Simulator crash reports (DiagnosticReports) ==="
          find "$HOME/Library/Logs/DiagnosticReports" -iname "*${BUNDLE_ID##*.}*" -newer "$APP_PATH/Info.plist" 2>/dev/null -exec echo "--- {} ---" \; -exec cat {} \; || echo "none found"
