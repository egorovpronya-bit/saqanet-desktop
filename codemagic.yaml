workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - code-signing
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: "false"
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    scripts:
      - name: Flutter packages and codegen
        script: |
          flutter pub get
          dart run slang
          dart run build_runner build --delete-conflicting-outputs --low-resources-mode
      - name: Build iOS core from source
        script: |
          set -euo pipefail
          # ray2sing is a nested submodule pinned via an SSH URL (git@github.com:...);
          # it's public, so rewrite SSH to HTTPS to avoid needing a deploy key in CI.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          cd hiddify-core
          git submodule update --init --recursive
          brew install go
          export PATH="$(go env GOPATH)/bin:$PATH"
          # `make ios` builds bin/HiddifyCore.xcframework, but gomobile bind bakes
          # the Swift module name from the -o basename (see cmd/gomobile/bind_iosapp.go:
          # title = strings.Title(basename without .xcframework)), so that comes out
          # named "HiddifyCore" - not "Libcore", the module every Swift file in ios/
          # imports (see ios/Local Packages/Package.swift's Libcore binaryTarget,
          # and the direct HiddifyCore.xcframework link in Runner.xcodeproj - both
          # point at this same file and both need the per-slice framework inside it
          # to be named Libcore.framework, confirmed against the previously-committed
          # prebuilt ios/Frameworks/Libcore.xcframework.zip). `-libname` is unrelated
          # to this (it only affects the Android .aar name).
          # `make ios`'s own recipe (below, kept in sync with hiddify-core's Makefile)
          # is reproduced here with only the -o basename changed. Deliberately NOT
          # doing `make ios`'s own `cp Info.plist bin/HiddifyCore.xcframework/` step:
          # hiddify-core/Info.plist is a static, hand-written file hardcoding
          # LibraryPath/BinaryPath as "HiddifyCore.framework" - copying it in would
          # clobber the correct Info.plist that `xcodebuild -create-xcframework`
          # (invoked internally by gomobile bind) already generated for Libcore.framework.
          make lib_install
          gomobile bind -v -target ios -libname=hiddify-core \
            -tags=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc,with_awg,tfogo_checklinkname0,with_naive_outbound,with_conntrack,with_dhcp,with_low_memory,with_purego \
            -trimpath -ldflags="-w -s -checklinkname=0 -buildid= ${CODE_VERSION:-}" \
            -o bin/Libcore.xcframework \
            github.com/sagernet/sing-box/experimental/libbox ./platform/mobile
          cd ..
          rm -rf ios/Frameworks/HiddifyCore.xcframework
          cp -r hiddify-core/bin/Libcore.xcframework ios/Frameworks/HiddifyCore.xcframework
      - name: CocoaPods
        script: |
          cd ios
          rm -f Podfile.lock
          pod install --repo-update
      - name: Set up code signing
        script: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Codemagic group code-signing is missing secret CERTIFICATE_PRIVATE_KEY."
            exit 1
          fi
          keychain initialize
          python3 ios/ci_capabilities.py --write-api-key /tmp/asc_api_key.p8
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/asc_api_key.p8)"
          rm -f /tmp/asc_api_key.p8
          python3 ios/ci_capabilities.py
          app-store-connect fetch-signing-files "ru.saqanet.vpn" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          app-store-connect fetch-signing-files "ru.saqanet.vpn.HiddifyPacketTunnel" \
            --type IOS_APP_STORE \
            --create \
            --strict-match-identifier \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          flutter build ios --release --config-only
          python3 ios/ci_signing.py
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - egorovpronya@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
